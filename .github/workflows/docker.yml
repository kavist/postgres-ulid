name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - pg_version: 17
            is_latest: false
          - pg_version: 18
            is_latest: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA and lowercased owner
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker tags
        id: docker_tags
        run: |
          TAGS="ghcr.io/${{ env.REPO_OWNER }}/postgres-ulid:${{ matrix.pg_version }},ghcr.io/${{ env.REPO_OWNER }}/postgres-ulid:${{ matrix.pg_version }}-${{ env.SHORT_SHA }}"
          if [ "${{ matrix.is_latest }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ env.REPO_OWNER }}/postgres-ulid:latest"
          fi
          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            postgresql_major=${{ matrix.pg_version }}
          tags: ${{ env.DOCKER_TAGS }}